name: Compose integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/compose-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose startup with synthetic data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GRAFANA_ADMIN_USER: ci-admin
      GRAFANA_ADMIN_PASSWORD: disposable-ci-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Generate synthetic inference data (TEMP)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            python:3.10-slim \
            python tests/fixtures/generate_inference_data.py

      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
