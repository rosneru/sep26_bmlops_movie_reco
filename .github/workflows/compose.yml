name: Compose integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/compose-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
      COMPOSE_PROJECT_NAME: movie-reco-ci
      PREDICT_MODEL_TYPE: knn
      PREDICT_MODEL_NAME: movie-genre-knn
      PREDICT_MODEL_VERSION: latest
      GRAFANA_ADMIN_USER: ci-admin
      GRAFANA_ADMIN_PASSWORD: disposable-ci-password
      # The data collection service only needs real values for /ingest,
      # which this workflow does not call
      DAGSHUB_S3_ENDPOINT_URL: https://example.invalid
      DAGSHUB_BUCKET: ci-dummy-bucket
      DAGSHUB_TOKEN: ci-dummy-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Generate synthetic inference data (TEMP)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            python:3.10-slim \
            python tests/fixtures/generate_inference_data.py

      - name: Register disposable KNN model
        run: |
          docker compose build train
          docker compose run --rm train

      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Test versioned registry loading
        run: |
          docker compose run --rm --no-deps --entrypoint python \
            -e MLFLOW_TEST_TRACKING_URI=http://mlflow:5000 \
            -v "$PWD/tests:/app/tests:ro" predict \
            -m unittest discover -s /app/tests/prediction -v

      - name: Test prediction through Nginx
        run: |
          curl --fail-with-body --show-error --silent \
            --connect-timeout 5 \
            --max-time 30 \
            -u alice:alice123 \
            -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_ids":[1],"seed":42}'

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
