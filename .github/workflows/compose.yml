name: Compose integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/compose-ci]
  workflow_dispatch:

# Stop an older run when the same PR or branch gets a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
      COMPOSE_PROJECT_NAME: movie-reco-ci
      PREDICT_MODEL_TYPE: knn
      PREDICT_MODEL_NAME: movie-genre-knn
      PREDICT_MODEL_VERSION: latest
      GRAFANA_ADMIN_USER: ci-admin
      GRAFANA_ADMIN_PASSWORD: disposable-ci-password
      # The data collection service only needs real values for /ingest,
      # which this workflow does not call
      DAGSHUB_S3_ENDPOINT_URL: https://example.invalid
      DAGSHUB_BUCKET: ci-dummy-bucket
      DAGSHUB_TOKEN: ci-dummy-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Generate synthetic inference data (TEMP)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            python:3.10-slim \
            python tests/fixtures/generate_inference_data.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Let Compose resolve the image tags, build arguments, and test override.
      - name: Prepare image builds
        run: docker compose --profile training build --print > "$RUNNER_TEMP/compose-bake.json"

      # Bake builds these targets together, reuses shared layers, and loads the
      # images into the runner's Docker engine for subsequent Compose commands.
      - name: Build all images with persistent layer caching
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ runner.temp }}/compose-bake.json
          targets: train,mlflow,predict,data_collection
          load: true
          set: |
            train.cache-from=type=gha,scope=compose-train
            train.cache-to=type=gha,scope=compose-train,mode=max
            mlflow.cache-from=type=gha,scope=compose-mlflow
            mlflow.cache-to=type=gha,scope=compose-mlflow,mode=max
            predict.cache-from=type=gha,scope=compose-predict
            predict.cache-to=type=gha,scope=compose-predict,mode=max
            data_collection.cache-from=type=gha,scope=compose-data-collection
            data_collection.cache-to=type=gha,scope=compose-data-collection,mode=max

      - name: Register disposable KNN model
        run: docker compose run --rm train

      - name: Start all services using built images
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Test versioned registry loading
        run: |
          docker compose run --rm --no-deps --entrypoint python \
            -e MLFLOW_TEST_TRACKING_URI=http://mlflow:5000 \
            -v "$PWD/tests:/app/tests:ro" predict \
            -m unittest discover -s /app/tests/prediction -v

      - name: Test prediction through Nginx
        run: |
          curl --fail-with-body --show-error --silent \
            --connect-timeout 5 \
            --max-time 30 \
            -u alice:alice123 \
            -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_ids":[1],"seed":42}'

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
