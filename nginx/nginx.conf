# Load balancer in front of the replicas of the 'predict' service

# Docker's internal DNS server returns the IP addresses of all replicas. It is
# asked again every 10s, so replicas that are restarted or added are found.
resolver 127.0.0.11 valid=10s;

upstream predict_api {
    zone predict_api 64k;
    server predict:8000 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://predict_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
