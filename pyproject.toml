[project]
name = "sep26-bmlops-movie-reco"
version = "0.1.0"
description = "Movie recommendation project from Liora September 2026 MLOps training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.106",
    "click>=8.5.0",
    "fastapi>=0.147.0",
    "pandas>=2.2.2,<3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn==1.4.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
# The services are applications, not an installable package. They import
# from src/ via PYTHONPATH=src (dvc.yaml) or --app-dir src (uvicorn).
package = false
# Installed by a plain 'uv sync', but left out of the API image
default-groups = ["dev", "dvc"]

[tool.pyright]
# Lets Pylance resolve the imports from src/ (config, features, ...)
extraPaths = ["src"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17.1",
]
dvc = [
    "dvc[s3]>=3.67.1",
]
