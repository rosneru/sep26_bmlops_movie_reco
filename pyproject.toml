[project]
name = "sep26-bmlops-movie-reco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Uwe Rosner", email = "oscottmusic@posteo.de" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.147.0",
    "pandas>=2.2.2,<3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn==1.4.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Installed by a plain 'uv sync', but left out of the API image
default-groups = ["dev", "dvc"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
dvc = [
    "dvc[s3]>=3.67.1",
]
